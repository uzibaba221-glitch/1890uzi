<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1890UZI | Secure Operations Network</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#05080d;
  color:#eaf7ff;
  min-height:100vh;
}

button,input{
  font:inherit;
}

.hidden{
  display:none!important;
}

/* AUTH */
#auth{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at 50% 0%,#103c4b 0%,transparent 45%),
    #05080d;
}

.auth-box{
  width:100%;
  max-width:520px;
  padding:35px;
  border:1px solid #164c5c;
  border-radius:24px;
  background:#081118;
  box-shadow:0 0 50px rgba(0,220,255,.08);
}

.logo{
  font-size:36px;
  font-weight:900;
  letter-spacing:3px;
  margin-bottom:12px;
}

.logo span{
  color:#28e7ff;
}

.subtitle{
  color:#55f0a2;
  letter-spacing:4px;
  font-size:13px;
  margin-bottom:28px;
}

h1{
  font-size:34px;
  margin-bottom:10px;
}

.description{
  color:#718b99;
  margin-bottom:25px;
  line-height:1.6;
}

.tabs{
  display:flex;
  gap:10px;
  margin-bottom:22px;
}

.tabs button{
  flex:1;
  padding:15px;
  border-radius:14px;
  border:1px solid #163743;
  background:#071017;
  color:#7e98a5;
  cursor:pointer;
}

.tabs button.active{
  border-color:#35e7ff;
  color:#35e7ff;
}

label{
  display:block;
  margin:15px 0 8px;
  color:#9ab1bc;
}

input{
  width:100%;
  padding:16px;
  border-radius:12px;
  border:1px solid #183743;
  background:#03070a;
  color:white;
  outline:none;
}

input:focus{
  border-color:#31ddf5;
}

.main-btn{
  width:100%;
  margin-top:22px;
  padding:17px;
  border:1px solid #36e7ff;
  border-radius:13px;
  background:#10343d;
  color:#43eaff;
  font-weight:bold;
  cursor:pointer;
}

.message{
  margin-top:15px;
  color:#ff7184;
  min-height:20px;
}

/* DASHBOARD */
#app{
  min-height:100vh;
}

nav{
  height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  border-bottom:1px solid #16242c;
  background:#070b10;
  position:sticky;
  top:0;
  z-index:10;
}

.nav-logo{
  font-weight:900;
  letter-spacing:2px;
}

.nav-logo span{
  color:#2deaff;
}

.logout{
  border:1px solid #273943;
  background:#10171d;
  color:#b7c8cf;
  padding:10px 16px;
  border-radius:10px;
  cursor:pointer;
}

main{
  max-width:1200px;
  margin:auto;
  padding:30px 20px 60px;
}

.hero{
  padding:30px;
  border:1px solid #153642;
  border-radius:22px;
  background:
    radial-gradient(circle at 90% 20%,rgba(36,223,255,.12),transparent 30%),
    #081118;
  margin-bottom:25px;
}

.hero h2{
  font-size:32px;
  margin-bottom:10px;
}

.hero p{
  color:#78919e;
  line-height:1.6;
}

.status{
  display:inline-block;
  margin-top:18px;
  padding:8px 12px;
  border-radius:20px;
  background:#0c2920;
  color:#55f0a2;
  font-size:13px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.card{
  padding:24px;
  border:1px solid #172d36;
  border-radius:18px;
  background:#091118;
}

.card .icon{
  font-size:28px;
  margin-bottom:15px;
}

.card h3{
  margin-bottom:10px;
}

.card p{
  color:#718995;
  line-height:1.5;
  font-size:14px;
}

.activity{
  margin-top:25px;
}

.activity h2{
  margin-bottom:15px;
}

.event{
  padding:16px;
  border-bottom:1px solid #15242c;
  color:#8ba1aa;
}

.event b{
  color:#eaf7ff;
}
