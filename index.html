<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#020817">
<title>1890 UZI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 50% -10%,#064d96 0%,#031b38 38%,#020817 75%);
  color:#f4f8ff;
  min-height:100vh;
  padding-bottom:90px;
}

button{
  font-family:inherit;
}

a{
  text-decoration:none;
  color:inherit;
}

/* ÜST BAR */
header{
  height:135px;
  background:rgba(1,9,24,.94);
  border-bottom:2px solid #07539c;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
  position:relative;
  z-index:10;
}

.logo{
  font-size:48px;
  font-weight:900;
  color:#169cff;
  text-shadow:0 0 22px rgba(0,145,255,.55);
  letter-spacing:1px;
}

.top-buttons{
  display:flex;
  gap:14px;
}

.top-btn{
  width:82px;
  height:82px;
  border-radius:25px;
  border:2px solid #0878db;
  background:#031b36;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
  box-shadow:0 0 18px rgba(0,126,255,.12);
}

/* ANA ALAN */
main{
  padding:46px 28px 35px;
}

.hero{
  width:100%;
  min-height:1110px;
  border:2px solid #168eff;
  border-radius:48px;
  overflow:hidden;
  position:relative;
  background:#020b1a;
  box-shadow:
    0 0 25px rgba(0,119,255,.12),
    inset 0 0 40px rgba(0,84,170,.12);
}

/* FOTOĞRAF */
.hero-photo{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center top;
  opacity:.70;
  filter:brightness(.72) saturate(1.05);
}

/* FOTOĞRAF ÜZERİ KARARTMA */
.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      to bottom,
      rgba(0,8,20,.08) 0%,
      rgba(0,8,20,.10) 30%,
      rgba(0,7,18,.55) 62%,
      rgba(0,5,15,.96) 88%,
      #020713 100%
    );
  pointer-events:none;
}

.hero-content{
  position:absolute;
  z-index:2;
  left:38px;
  right:38px;
  bottom:48px;
}

/* ETİKET */
.status{
  display:inline-flex;
  align-items:center;
  gap:14px;
  border:2px solid #008bc5;
  border-radius:40px;
  padding:13px 28px;
  background:rgba(2,20,38,.65);
  color:#62c8ff;
  font-size:24px;
  font-weight:bold;
  margin-bottom:25px;
}

.status-dot{
  width:18px;
  height:18px;
  border-radius:50%;
  background:#20ef72;
  box-shadow:0 0 15px #20ef72;
}

/* 1890 */
.big-number{
  font-size:112px;
  line-height:.9;
  font-weight:900;
  letter-spacing:7px;
  color:#149cff;
  text-shadow:
    0 0 12px rgba(0,130,255,.7),
    0 0 35px rgba(0,100,255,.4);
  margin-bottom:25px;
}

.subtitle{
  font-size:31px;
  color:#e9f1ff;
  margin-bottom:44px;
}

.actions{
  display:flex;
  gap:18px;
}

.action{
  min-width:195px;
  height:88px;
  border-radius:28px;
  border:2px solid #078fff;
  background:rgba(3,25,50,.82);
  color:white;
  font-size:25px;
  font-weight:bold;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  cursor:pointer;
}

.action.primary{
  background:#159df4;
  border-color:#159df4;
  box-shadow:0 0 20px rgba(0,145,255,.25);
}

/* BÖLÜMLER */
.section{
  display:none;
  padding:35px 25px;
}

.section.active{
  display:block;
}

.section-title{
  font-size:32px;
  color:#36a9ff;
  margin-bottom:25px;
}

.card{
  background:rgba(3,22,43,.92);
  border:1px solid #116fc2;
  border-radius:25px;
  padding:25px;
  margin-bottom:18px;
}

/* GALERİ */
.gallery{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.gallery img{
  width:100%;
  height:240px;
  object-fit:cover;
  border-radius:20px;
  border:2px solid #086ed0;
}

/* ALT MENÜ */
.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:105px;
  background:rgba(2,10,25,.97);
  border-top:2px solid #07539c;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:50;
  backdrop-filter:blur(10px);
}

.nav-item{
  flex:1;
  height:100%;
  border:0;
  background:transparent;
  color:#8795ad;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  font-size:18px;
  cursor:pointer;
}

.nav-icon{
  font-size:35px;
  line-height:1;
}

.nav-item.active{
  color:#159cff;
  text-shadow:0 0 15px rgba(0,150,255,.5);
}

/* SOHBET */
.chat-box{
  min-height:420px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  gap:12px;
}

.message{
  background:#082b50;
  border:1px solid #116db9;
  border-radius:18px;
  padding:15px;
  max-width:85%;
}

.message.mine{
  align-self:flex-end;
  background:#087fd4;
}

/* AYARLAR */
.setting{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:20px 5px;
  border-bottom:1px solid rgba(80,140,200,.2);
  font-size:19px;
}

.switch{
  width:52px;
  height:28px;
  border-radius:20px;
  background:#168fff;
  position:relative;
}

.switch::after{
  content:"";
  position:absolute;
  width:22px;
  height:22px;
  border-radius:50%;
  background:white;
  right:3px;
  top:3px;
}

/* PROFİL */
.profile{
  text-align:center;
  padding:30px 10px;
}

.profile-icon{
  width:115px;
  height:115px;
  border-radius:50%;
  margin:0 auto 20px;
  background:#09284b;
  border:2px solid #159cff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:65px;
}

/* MOBİL */
@media(max-width:600px){

  header{
    height:135px;
    padding:0 18px;
  }

  .logo{
    font-size:40px;
  }

  .top-buttons{
    gap:9px;
  }

  .top-btn{
    width:72px;
    height:72px;
    border-radius:23px;
    font-size:35px;
  }

  main{
    padding:46px 28px 35px;
  }

  .hero{
    min-height:1110px;
    border-radius:45px;
  }

  .hero-content{
    left:38px;
    right:38px;
    bottom:48px;
  }

  .status{
    font-size:21px;
    padding:12px 23px;
  }

  .big-number{
    font-size:96px;
  }

  .subtitle{
    font-size:29px;
  }

  .actions{
    gap:16px;
  }

  .action{
    min-width:0;
    flex:1;
    height:88px;
    font-size:23px;
  }

  .bottom-nav{
    height:105px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">1890 UZI</div>

  <div class="top-buttons">
    <button class="top-btn" onclick="openSearch()">🔎</button>
    <button class="top-btn" onclick="showNotification()">🔔</button>
  </div>
</header>


<main>

  <!-- ANA SAYFA -->
  <section id="home" class="section active">

    <div class="hero">

      <!-- ANA FOTOĞRAF -->
      <img
        class="hero-photo"
        src="IMG_20260721_001451_128.jpg"
        alt="1890 UZI">

      <div class="hero-content">

        <div class="status">
          <span class="status-dot"></span>
          1890 DIGITAL CENTER
        </div>

        <div class="big-number">1890</div>

        <div class="subtitle">
          UZI&nbsp; • &nbsp;Dijital Merkez
        </div>

        <div class="actions">

          <button class="action primary" onclick="showExplore()">
            ⚡ Keşfet
          </button>

          <button class="action" onclick="goTo('gallery')">
            📸 Galeri
          </button>

        </div>

      </div>
    </div>

  </section>


  <!-- GALERİ -->
  <section id="gallery" class="section">

    <h2 class="section-title">📸 Galeri</h2>

    <div class="card">

      <div class="gallery">

        <img
          src="IMG_20260721_001451_128.jpg"
          alt="1890">

        <img
          src="IMG_20260801_023500_914.jpg"
          alt="1890">

        <img
          src="IMG_20260810_014337_944.jpg"
          alt="1890">

        <img
          src="file_00000000a530820a895ae4680d3c43ac.png"
          alt="1890">

      </div>

    </div>

  </section>


  <!-- SOHBET -->
  <section id="chat" class="section">

    <h2 class="section-title">💬 Sohbet</h2>

    <div class="card chat-box">

      <div class="message">
        1890 UZI Dijital Merkez'e hoş geldin. 👋
      </div>

      <div class="message mine">
        1890 UZI 🔥
      </div>

      <div class="message">
        Buradan sohbet bölümünü kullanabilirsin.
      </div>

    </div>

  </section>


  <!-- AYARLAR -->
  <section id="settings" class="section">

    <h2 class="section-title">⚙️ Ayarlar</h2>

    <div class="card">

      <div class="setting">
        <span>Bildirimler</span>
        <span class="switch"></span>
      </div>

      <div class="setting">
        <span>Karanlık görünüm</span>
        <span class="switch"></span>
      </div>

      <div class="setting">
        <span>Animasyonlar</span>
        <span class="switch"></span>
      </div>

    </div>

  </section>


  <!-- PROFİL -->
  <section id="profile" class="section">

    <h2 class="section-title">👤 Profil</h2>

    <div class="card profile">

      <div class="profile-icon">
        👤
      </div>

      <h2>1890 UZI</h2>

      <p style="margin-top:12px;color:#9eb1ca;">
        1890 Dijital Merkez
      </p>

    </div>

  </section>

</main>


<!-- ALT MENÜ -->
<nav class="bottom-nav">

  <button class="nav-item active" onclick="goTo('home',this)">
    <span class="nav-icon">⌂</span>
    <span>Ana Sayfa</span>
  </button>

  <button class="nav-item" onclick="goTo('chat',this)">
    <span class="nav-icon">💬</span>
    <span>Sohbet</span>
  </button>

  <button class="nav-item" onclick="goTo('settings',this)">
    <span class="nav-icon">⚙️</span>
    <span>Ayarlar</span>
  </button>

  <button class="nav-item" onclick="goTo('profile',this)">
    <span class="nav-icon">👤</span>
    <span>Profil</span>
  </button>

</nav>


<script>

function goTo(page,button){

  document.querySelectorAll('.section').forEach(function(section){
    section.classList.remove('active');
  });

  var target=document.getElementById(page);

  if(target){
    target.classList.add('active');
    window.scrollTo({
      top:0,
      behavior:'smooth'
    });
  }

  document.querySelectorAll('.nav-item').forEach(function(item){
    item.classList.remove('active');
  });

  if(button){
    button.classList.add('active');
  }else{

    document.querySelectorAll('.nav-item').forEach(function(item){

      var text=item.innerText.toLowerCase();

      if(
        (page==='home' && text.includes('ana')) ||
        (page==='chat' && text.includes('sohbet')) ||
        (page==='settings' && text.includes('ayar')) ||
        (page==='profile' && text.includes('profil'))
      ){
        item.classList.add('active');
      }

    });

  }
}

function showExplore(){

  alert(
    "⚡ 1890 UZI\n\n" +
    "Dijital Merkez'e hoş geldin!"
  );

}

function showNotification(){

  alert(
    "🔔 Bildirimler\n\n" +
    "Şimdilik yeni bildirim yok."
  );

}

function openSearch(){

  var text=prompt("🔎 Ne aramak istiyorsun?");

  if(text){
    alert("Arama: "+text);
  }

}

</script>

</body>
  </html>
