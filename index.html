<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#020817">
<title>1890 UZI | Dijital Center</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 50% -10%,#064b91 0%,#031b36 35%,#020817 75%);
  color:#f4f8ff;
  min-height:100vh;
}

header{
  height:145px;
  padding:30px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:2px solid #1266ad;
  background:#020b1a;
}

.logo{
  font-size:42px;
  font-weight:900;
  color:#249cff;
  text-shadow:0 0 22px #087cff;
}

.top-buttons{
  display:flex;
  gap:14px;
}

.top-btn{
  width:70px;
  height:70px;
  border:2px solid #147bd2;
  border-radius:22px;
  background:#06172d;
  color:white;
  font-size:32px;
}

.main{
  padding:48px 22px 90px;
}

.hero{
  min-height:1050px;
  max-width:720px;
  margin:auto;
  padding:60px 40px 45px;
  border:2px solid #1594ff;
  border-radius:55px;
  background:
    linear-gradient(180deg,rgba(5,43,80,.95),rgba(1,11,27,.98));
  box-shadow:
    0 0 30px rgba(0,132,255,.18),
    inset 0 0 40px rgba(0,112,255,.08);
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
}

.status{
  display:inline-flex;
  align-items:center;
  gap:14px;
  width:max-content;
  padding:15px 27px;
  margin-bottom:45px;
  border:2px solid #087fa9;
  border-radius:40px;
  color:#6bc7ff;
  font-size:22px;
  font-weight:bold;
}

.dot{
  width:18px;
  height:18px;
  border-radius:50%;
  background:#20ef70;
  box-shadow:0 0 15px #20ef70;
}

.number{
  font-size:105px;
  font-weight:900;
  color:#239cff;
  text-shadow:0 0 30px rgba(0,137,255,.65);
  letter-spacing:8px;
}

.subtitle{
  font-size:32px;
  margin:15px 0 45px;
  color:#e8f1ff;
}

.buttons{
  display:flex;
  gap:18px;
  flex-wrap:wrap;
}

.btn{
  flex:1;
  min-width:210px;
  padding:22px 25px;
  border-radius:38px;
  border:2px solid #1689ee;
  background:#071a32;
  color:white;
  font-size:23px;
  font-weight:bold;
}

.btn.primary{
  background:#1795f5;
  box-shadow:0 0 25px rgba(0,145,255,.35);
}

.section{
  max-width:720px;
  margin:35px auto 0;
  padding:30px;
  border:2px solid #116db7;
  border-radius:30px;
  background:#031326;
}

.section h2{
  color:#54baff;
  font-size:28px;
  margin-bottom:25px;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.gallery img{
  width:100%;
  height:220px;
  object-fit:cover;
  border-radius:18px;
  border:2px solid #126ebc;
  background:#06172a;
  cursor:pointer;
}

.empty{
  color:#9bb4cc;
  line-height:1.6;
}

footer{
  text-align:center;
  padding:35px 20px;
  color:#7191ae;
}

@media(max-width:600px){
  header{
    height:125px;
    padding:25px 18px;
  }

  .logo{
    font-size:30px;
  }

  .top-btn{
    width:58px;
    height:58px;
    font-size:26px;
  }

  .main{
    padding:30px 14px 70px;
  }

  .hero{
    min-height:780px;
    padding:35px 25px;
    border-radius:38px;
  }

  .number{
    font-size:78px;
  }

  .subtitle{
    font-size:25px;
  }

  .status{
    font-size:17px;
  }

  .gallery img{
    height:170px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">1890 UZI</div>

  <div class="top-buttons">
    <button class="top-btn" onclick="document.getElementById('gallery').scrollIntoView()">🔎</button>
    <button class="top-btn" onclick="alert('1890 UZI Dijital Center')">🔔</button>
  </div>
</header>

<main class="main">

  <section class="hero">

    <div class="status">
      <span class="dot"></span>
      1890 DIGITAL CENTER
    </div>

    <div class="number">1890</div>

    <div class="subtitle">
      UZI • Dijital Merkez
    </div>

    <div class="buttons">
      <button class="btn primary" onclick="alert('ID SYSTEM aktif')">
        🔑 ID SYSTEM
      </button>

      <button class="btn" onclick="document.getElementById('gallery').scrollIntoView()">
        📸 Galeri
      </button>
    </div>

  </section>

  <section class="section" id="gallery">
    <h2>📸 1890 UZI GALERİ</h2>

    <div class="gallery" id="photoGallery">
      <div class="empty">Fotoğraflar yükleniyor...</div>
    </div>
  </section>

</main>

<footer>
  1890 UZI • Digital Center
</footer>

<script>
/*
  GitHub deposundaki resimleri otomatik bulur.
  Böylece dosya isimlerini tek tek yazmaya gerek kalmaz.
*/

const owner = "uzibaba221-glitch";
const repo = "1890uzi";
const branch = "main";

const gallery = document.getElementById("photoGallery");

async function loadPhotos(){

  try{

    const api =
      `https://api.github.com/repos/${owner}/${repo}/git/trees/${branch}?recursive=1`;

    const response = await fetch(api);

    if(!response.ok){
      throw new Error("GitHub dosyaları alınamadı");
    }

    const data = await response.json();

    const imageFiles = data.tree.filter(file => {

      if(file.type !== "blob") return false;

      const name = file.path.toLowerCase();

      return (
        name.endsWith(".jpg") ||
        name.endsWith(".jpeg") ||
        name.endsWith(".png") ||
        name.endsWith(".webp") ||
        name.endsWith(".gif")
      );

    });

    gallery.innerHTML = "";

    if(imageFiles.length === 0){

      gallery.innerHTML =
        '<div class="empty">Henüz fotoğraf bulunamadı.</div>';

      return;
    }

    imageFiles.forEach(file => {

      const img = document.createElement("img");

      img.src =
        `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${file.path}`;

      img.alt = "1890 UZI";

      img.loading = "lazy";

      img.onclick = () => {
        window.open(img.src,"_blank");
      };

      gallery.appendChild(img);

    });

  }catch(error){

    gallery.innerHTML =
      '<div class="empty">Fotoğraflar yüklenemedi. Sayfayı yenileyip tekrar deneyin.</div>';

    console.log(error);

  }

}

loadPhotos();
</script>

</body>
</html>
