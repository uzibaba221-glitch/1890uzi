<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05070c">

<title>uzi1890 | Digital Center</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Inter,Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 50% -15%,#173b67 0%,#080d16 35%,#03050a 75%);
  color:#fff;
  min-height:100vh;
  padding-bottom:90px;
}

button,a{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}


/* =========================
   HEADER
========================= */

header{
  position:sticky;
  top:0;
  z-index:100;

  height:78px;
  padding:0 22px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  background:rgba(5,8,14,.86);
  backdrop-filter:blur(22px);

  border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
  font-size:29px;
  font-weight:900;
  letter-spacing:-1px;

  background:linear-gradient(90deg,#fff,#55b7ff,#168cff);
  -webkit-background-clip:text;
  color:transparent;

  text-shadow:0 0 30px rgba(35,150,255,.2);
}

.header-right{
  display:flex;
  gap:9px;
}

.header-btn{
  width:45px;
  height:45px;

  border:1px solid rgba(255,255,255,.1);
  border-radius:15px;

  background:rgba(255,255,255,.06);
  color:#fff;

  font-size:19px;
}


/* =========================
   MAIN
========================= */

main{
  width:min(1180px,94%);
  margin:auto;
  padding:22px 0 35px;
}

.section{
  margin-top:28px;
}


/* =========================
   HERO
========================= */

.hero{
  min-height:620px;
  position:relative;
  overflow:hidden;

  border-radius:30px;

  border:1px solid rgba(255,255,255,.12);

  background:#070b12;

  box-shadow:
    0 25px 80px rgba(0,0,0,.45),
    0 0 50px rgba(0,120,255,.08);
}

.hero img{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;
  object-position:center;

  filter:brightness(.62) saturate(1.05);
}

.hero-overlay{
  position:absolute;
  inset:0;

  background:
    linear-gradient(
      90deg,
      rgba(2,5,10,.94) 0%,
      rgba(2,5,10,.55) 45%,
      rgba(2,5,10,.08) 100%
    ),
    linear-gradient(
      0deg,
      rgba(2,5,10,.95) 0%,
      transparent 55%
    );
}

.hero-content{
  position:absolute;
  z-index:2;

  left:45px;
  right:45px;
  bottom:42px;
}

.live{
  display:inline-flex;
  align-items:center;
  gap:8px;

  padding:8px 13px;

  border-radius:30px;

  background:rgba(20,145,255,.12);
  border:1px solid rgba(70,175,255,.4);

  color:#8bcfff;

  font-size:12px;
  font-weight:700;

  margin-bottom:18px;
}

.live-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#39ef82;
  box-shadow:0 0 12px #39ef82;
}

.hero h1{
  font-size:clamp(65px,10vw,120px);
  line-height:.85;
  letter-spacing:-5px;
  font-weight:1000;
}

.hero-sub{
  margin-top:17px;

  color:#d5dfed;
  font-size:18px;
}

.hero-actions{
  display:flex;
  gap:10px;
  margin-top:24px;
}

.btn{
  min-height:48px;
  padding:0 20px;

  border-radius:15px;

  border:1px solid rgba(255,255,255,.15);

  color:white;
  background:rgba(255,255,255,.07);

  font-weight:700;
}

.btn.primary{
  border:0;
  background:#168cff;
  box-shadow:0 10px 30px rgba(0,130,255,.25);
}


/* =========================
   SECTION HEADER
========================= */

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:end;

  margin-bottom:13px;
}

.section-head h2{
  font-size:23px;
}

.section-head span{
  color:#6e819b;
  font-size:12px;
}


/* =========================
   QUICK CARDS
========================= */

.quick-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.quick{
  padding:20px;

  min-height:130px;

  border-radius:21px;

  background:
    linear-gradient(
      145deg,
      rgba(18,30,48,.92),
      rgba(7,11,18,.94)
    );

  border:1px solid rgba(255,255,255,.08);

  transition:.2s;
}

.quick:hover{
  transform:translateY(-3px);
  border-color:rgba(40,155,255,.4);
}

.quick-icon{
  font-size:27px;
  margin-bottom:16px;
}

.quick b{
  font-size:15px;
}

.quick p{
  color:#78899e;
  font-size:12px;
  margin-top:6px;
  line-height:1.4;
}


/* =========================
   FEATURE GRID
========================= */

.feature-grid{
  display:grid;
  grid-template-columns:1.35fr .65fr;
  gap:14px;
}

.panel{
  border-radius:24px;

  background:
    linear-gradient(
      145deg,
      rgba(15,25,40,.95),
      rgba(5,8,14,.96)
    );

  border:1px solid rgba(255,255,255,.08);

  overflow:hidden;
}

.panel-padding{
  padding:20px;
}


/* =========================
   PROFILE
========================= */

.profile-card{
  min-height:300px;
  padding:23px;

  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.profile-top{
  display:flex;
  align-items:center;
  gap:15px;
}

.profile-photo{
  width:70px;
  height:70px;

  border-radius:50%;

  object-fit:cover;

  border:2px solid rgba(40,155,255,.7);
}

.profile-name{
  font-size:21px;
  font-weight:800;
}

.verified{
  color:#27a4ff;
}

.profile-tag{
  margin-top:5px;
  color:#74869c;
  font-size:12px;
}

.profile-info{
  color:#9aabbe;
  font-size:13px;
  line-height:1.6;
}

.profile-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:20px;
}

.profile-stat{
  padding:13px 5px;
  text-align:center;

  border-radius:14px;
  background:rgba(255,255,255,.04);
}

.profile-stat b{
  display:block;
  font-size:17px;
}

.profile-stat span{
  color:#68798e;
  font-size:9px;
}


/* =========================
   NEWS
========================= */

.news-list{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.news{
  display:block;

  padding:16px;

  border-radius:17px;

  background:rgba(255,255,255,.035);

  border:1px solid rgba(255,255,255,.06);

  transition:.2s;
}

.news:hover{
  background:rgba(30,140,255,.08);
}

.news small{
  color:#3faeff;
  font-size:10px;
  font-weight:700;
}

.news h3{
  font-size:14px;
  margin-top:6px;
  line-height:1.35;
}

.news p{
  color:#73849a;
  font-size:11px;
  margin-top:5px;
}


/* =========================
   GALLERY
========================= */

.gallery{
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  grid-auto-rows:180px;
  gap:10px;
}

.gallery-item{
  position:relative;
  overflow:hidden;
  border-radius:19px;
  border:1px solid rgba(255,255,255,.09);
}

.gallery-item:first-child{
  grid-row:span 2;
}

.gallery-item img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:.4s;
}

.gallery-item:hover img{
  transform:scale(1.06);
}

.gallery-caption{
  position:absolute;
  left:0;
  right:0;
  bottom:0;

  padding:35px 13px 13px;

  background:linear-gradient(transparent,rgba(0,0,0,.85));

  font-size:12px;
  font-weight:700;
}


/* =========================
   SOCIAL
========================= */

.social-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:10px;
}

.social{
  min-height:105px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:9px;

  border-radius:19px;

  background:rgba(255,255,255,.035);

  border:1px solid rgba(255,255,255,.07);

  transition:.2s;
}

.social:hover{
  transform:translateY(-3px);
  border-color:rgba(30,150,255,.4);
}

.social-icon{
  width:43px;
  height:43px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:13px;

  background:#101a28;

  font-size:21px;
}

.social-name{
  color:#a9b8ca;
  font-size:11px;
}


/* =========================
   MUSIC
========================= */

.music{
  padding:24px;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;

  border-radius:24px;

  background:
    linear-gradient(
      110deg,
      #0c1b2e,
      #070c14
    );

  border:1px solid rgba(255,255,255,.08);
}

.music-title{
  font-size:19px;
  font-weight:800;
}

.music-sub{
  margin-top:6px;
  color:#75879d;
  font-size:12px;
}

.music-buttons{
  display:flex;
  gap:8px;
}

.music-btn{
  padding:11px 14px;
  border-radius:13px;

  background:#101b2a;
  border:1px solid rgba(255,255,255,.08);

  color:#fff;
  font-size:12px;
}


/* =========================
   ABOUT
========================= */

.about{
  padding:24px;

  border-radius:24px;

  background:
    linear-gradient(
      145deg,
      #0c1727,
      #05080e
    );

  border:1px solid rgba(255,255,255,.08);
}

.about h2{
  font-size:20px;
}

.about p{
  margin-top:10px;

  color:#8293a8;
  font-size:13px;
  line-height:1.7;
}


/* =========================
   FOOTER
========================= */

footer{
  text-align:center;

  padding:35px 10px 20px;

  color:#526276;
  font-size:11px;
}


/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
  position:fixed;

  left:50%;
  bottom:12px;

  transform:translateX(-50%);

  width:min(650px,94%);
  height:67px;

  display:grid;
  grid-template-columns:repeat(5,1fr);

  padding:5px;

  background:rgba(8,12,20,.94);
  backdrop-filter:blur(20px);

  border:1px solid rgba(255,255,255,.1);

  border-radius:23px;

  z-index:200;

  box-shadow:
    0 15px 50px rgba(0,0,0,.5);
}

.nav-item{
  border:0;
  background:transparent;

  color:#65758a;

  border-radius:18px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:3px;

  font-size:9px;
}

.nav-icon{
  font-size:20px;
}

.nav-item.active{
  color:#4caeff;
  background:rgba(30,140,255,.1);
}


/* =========================
   SEARCH MODAL
========================= */

.modal{
  position:fixed;
  inset:0;

  z-index:500;

  display:none;
  align-items:flex-start;
  justify-content:center;

  padding:90px 18px;

  background:rgba(0,0,0,.7);
  backdrop-filter:blur(10px);
}

.modal.open{
  display:flex;
}

.modal-box{
  width:min(550px,100%);

  padding:22px;

  border-radius:24px;

  background:#0b111b;

  border:1px solid rgba(60,165,255,.35);
}

.modal-title{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:15px;
}

.close{
  width:36px;
  height:36px;

  border:0;
  border-radius:11px;

  background:#182231;
  color:#fff;

  font-size:20px;
}

.search-input{
  width:100%;

  height:52px;

  border-radius:15px;

  border:1px solid rgba(255,255,255,.1);

  background:#050910;

  color:#fff;

  padding:0 15px;

  outline:none;
}

.search-input:focus{
  border-color:#168cff;
}

   RESPONSIVE
========================= */

@media(max-width:850
